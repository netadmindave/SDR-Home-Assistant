configuration:
  mode:
    name: Mode
    description: "auto: survey during the survey schedule plus short random daytime slots, monitor otherwise. survey: always survey. monitor: monitoring only, never surveys."
  survey_schedule:
    name: Survey schedule (local time)
    description: "Auto mode surveys inside these windows, e.g. 01:00-05:00. Comma-separate several; may wrap midnight."
  initial_survey:
    name: Initial survey
    description: Optional. Auto mode surveys around the clock for the first days after first start, to build the device list faster.
  initial_survey_days:
    name: Initial survey length (days)
  daytime_survey_min_per_hour:
    name: Daytime survey (min per hour)
    description: Auto mode spends this many minutes per monitored hour surveying one randomly chosen frequency, at a random time. 0 disables.
  monitor_dwell_s:
    name: Monitor visit length (s)
    description: Longest visit to a non-home frequency in monitor mode; a visit ends early once all its devices have reported.
  monitor_refresh_min:
    name: Monitor refresh (min)
    description: Revisit a frequency when its devices haven't been heard for this long. The rest of the time the dongle parks on the home frequency.
  stale_after_min:
    name: Mark stale after (min)
    description: Timer-reporting devices go unavailable in HA after this long without a report. Event devices (door sensors, remotes) are exempt. 0 disables.
  device:
    name: Dongle
    description: RTL-SDR device index (0) or serial number.
  gain:
    name: Gain
    description: "auto, or a tuner gain in dB such as 40.2."
  ppm:
    name: Frequency correction (ppm)
  decode_dwell_s:
    name: Decode dwell (s)
    description: Seconds spent on each rtl_433 frequency, multiplied by the slot's weight.
  sweep_dwell_s:
    name: Sweep dwell (s)
    description: Seconds spent sweeping each band with rtl_power.
  sweep_integration_s:
    name: Sweep integration (s)
  peak_threshold_db:
    name: Peak threshold (dB)
    description: How far above the noise floor a sweep bin must be to count as a signal.
  publish_raw:
    name: Publish raw survey events
    description: Publish every decode (approved or not) to <base_topic>/survey/<uid>.
  base_topic:
    name: MQTT base topic
  discovery_prefix:
    name: HA discovery prefix
  log_level:
    name: Log level
  mqtt_host:
    name: MQTT host
    description: Leave empty to use the Mosquitto add-on automatically.
  mqtt_port:
    name: MQTT port
  mqtt_user:
    name: MQTT user
  mqtt_password:
    name: MQTT password
  rtl_433_extra_args:
    name: Extra rtl_433 arguments
    description: "e.g. -R -59 to disable a noisy decoder."
  survey_all_decoders:
    name: Enable all decoders while surveying
    description: Also turn on rtl_433's off-by-default decoders during survey slots. Finds more devices; more false matches.
  frequencies:
    name: Frequencies
    description: Catalog ids to include in the scan. Easier to edit on the add-on's Frequencies tab.
  custom_frequencies:
    name: Custom frequencies
    description: "One per line: '<freq> <rtl_433|aprs|noaa>' or '<low>:<high>:<step> sweep'."
  sdrs:
    name: Receivers (SDRs)
    description: "Empty = one dongle (the Dongle option). Several: one entry per dongle with a name, device index or serial, and role (rotating = shares the scan; dedicated = only the frequencies assigned to it). Easier to edit on the add-on's Settings tab."
  assignments:
    name: Frequency assignments
    description: "'<frequency id>=<receiver name>'. Set on the add-on's Frequencies tab."
  enable_aprs:
    name: Direwolf APRS
  enable_noaa:
    name: NOAA weather radio SAME alerts
  enable_adsb:
    name: readsb ADS-B aircraft
  enable_ais:
    name: rtl_ais marine AIS
  radiosonde_enabled:
    name: Track radiosondes
    description: Hand the dongle to radiosonde_auto_rx during the launch windows.
  radiosonde_windows_utc:
    name: Radiosonde windows (UTC)
    description: "Comma-separated HH:MM-HH:MM windows in UTC; may wrap midnight."
  radiosonde_min_mhz:
    name: Radiosonde search start (MHz)
  radiosonde_max_mhz:
    name: Radiosonde search end (MHz)
  radiosonde_publish_ha:
    name: Publish Radiosonde tracker to HA
  sondehub_callsign:
    name: SondeHub callsign
    description: Set to upload your sonde reception to sondehub.org. Empty disables uploads.
  sondehub_email:
    name: SondeHub contact email
  station_lat:
    name: Station latitude
    description: Leave empty to use Home Assistant's home location.
  station_lon:
    name: Station longitude
  station_alt:
    name: Station altitude (m)
network:
  5000/tcp: radiosonde_auto_rx web map (only live during sonde windows)
